<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴士到站時間 Release 1.0</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ccc;
            margin: 15px 0 20px 0;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 5px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #545b62;
        }
        .page {
            display: none;
        }
        .active {
            display: block;
        }
        textarea {
            width: 100%;
            height: 250px;
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 10px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f2f2f2;
        }
        .error-msg {
            color: #d9534f;
            margin-top: 10px;
            white-space: pre-wrap;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        .timer-badge {
            font-size: 13px;
            color: #666;
            margin-left: 5px;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <!-- HOME PAGE -->
    <div id="homePage" class="page active">
        <h1>巴士到站時間 Release 1.0</h1>
        <hr>
        <button class="btn" onclick="goToSetup()">Set up</button>
        <button class="btn btn-secondary" onclick="manualRefresh()">Refresh ETA</button>
        <span id="refreshTimer" class="timer-badge">Auto-refresh in 10s</span>

        <div id="etaDisplay">
            <table>
                <thead>
                    <tr>
                        <th>Route</th>
                        <th>Destination (S)</th>
                        <th>Next Bus (ETA 1)</th>
                        <th>Subsequent Bus (ETA 2)</th>
                        <th>3rd Bus (ETA 3)</th>
                    </tr>
                </thead>
                <tbody id="etaTableBody">
                    <tr><td colspan="5" class="loading">No configuration loaded. Click 'Set up' to add API instructions.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- SETUP PAGE -->
    <div id="setupPage" class="page">
        <h1>Set Up</h1>
        <hr>
        <p>Enter instruction lines in the format: <code>O;S;D;U</code></p>
        <textarea id="apiConfigInput" placeholder="海韻花園;荃灣;O;https://data.etabus.gov.hk/v1/transport/kmb/eta/..."></textarea>
        
        <div id="validationError" class="error-msg"></div>

        <div id="setupActions" style="margin-top: 10px;">
            <button id="btnConfirm" class="btn" onclick="handleConfirm()">Confirm</button>
            <button id="btnEdit" class="btn btn-secondary" onclick="handleEdit()" style="display: none;">Edit</button>
            <button id="btnSave" class="btn" onclick="handleSave()" style="display: none;">Save</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'bus_eta_config_v1.0';
        const REFRESH_INTERVAL = 10; // seconds

        let countdownInterval = null;
        let secondsRemaining = REFRESH_INTERVAL;

        // Sample initial data if none exists
        const defaultInstructions = 
`海韻花園;荃灣;O;https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234A/1
海韻花園;荃灣;I;https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234B/1
海韻花園;荃灣;O;https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/53/1
海韻花園;荃灣;O;https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52X/1
海韻花園;銅鑼灣;O;https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/002618/952
碧堤半島;屯門;I;https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/52X/1
碧堤半島;元朗;I;https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/53/1
碧堤半島;置樂花園;I;https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/002619/952`;

        // Initialize Page
        window.onload = function() {
            if (!localStorage.getItem(STORAGE_KEY)) {
                localStorage.setItem(STORAGE_KEY, defaultInstructions);
            }
            fetchETAs();
            startAutoRefresh();
        };

        // Auto Refresh Timer Management
        function startAutoRefresh() {
            stopAutoRefresh();
            secondsRemaining = REFRESH_INTERVAL;
            updateTimerDisplay();

            countdownInterval = setInterval(() => {
                secondsRemaining--;
                if (secondsRemaining <= 0) {
                    secondsRemaining = REFRESH_INTERVAL;
                    fetchETAs();
                }
                updateTimerDisplay();
            }, 1000);
        }

        function stopAutoRefresh() {
            if (countdownInterval) clearInterval(countdownInterval);
        }

        function updateTimerDisplay() {
            const timerElement = document.getElementById('refreshTimer');
            if (timerElement) {
                timerElement.innerText = `Auto-refresh in ${secondsRemaining}s`;
            }
        }

        function manualRefresh() {
            fetchETAs();
            startAutoRefresh();
        }

        // Navigation
        function goToSetup() {
            stopAutoRefresh();
            document.getElementById('homePage').classList.remove('active');
            document.getElementById('setupPage').classList.add('active');
            
            const savedData = localStorage.getItem(STORAGE_KEY) || defaultInstructions;
            const textarea = document.getElementById('apiConfigInput');
            textarea.value = savedData;
            textarea.disabled = false;

            document.getElementById('validationError').innerText = '';
            document.getElementById('btnConfirm').style.display = 'inline-block';
            document.getElementById('btnEdit').style.display = 'none';
            document.getElementById('btnSave').style.display = 'none';
        }

        function goToHome() {
            document.getElementById('setupPage').classList.remove('active');
            document.getElementById('homePage').classList.add('active');
            fetchETAs();
            startAutoRefresh();
        }

        // Setup Page Logic & Validation
        function parseAndValidateLine(line) {
            const parts = line.split(';').map(p => p.trim());
            if (parts.length !== 4) return { valid: false, error: 'Must contain exactly 3 semicolons (O;S;D;U)' };
            
            const [O, S, D, U] = parts;
            if (O.length < 1) return { valid: false, error: 'Origin (O) must contain at least 1 character' };
            if (S.length < 1) return { valid: false, error: 'Destination (S) must contain at least 1 character' };
            if (D !== 'O' && D !== 'I') return { valid: false, error: 'Direction (D) must be either "O" or "I"' };
            if (!U.startsWith('https://')) return { valid: false, error: 'URL (U) must start with https://' };

            return { valid: true, parsed: { O, S, D, U } };
        }

        function handleConfirm() {
            const textarea = document.getElementById('apiConfigInput');
            const lines = textarea.value.split('\n').filter(line => line.trim().length > 0);
            const errors = [];

            lines.forEach((line, index) => {
                const res = parseAndValidateLine(line);
                if (!res.valid) {
                    errors.push(`Line ${index + 1}: ${res.error}`);
                }
            });

            const errContainer = document.getElementById('validationError');
            if (errors.length > 0) {
                errContainer.innerText = errors.join('\n');
            } else {
                errContainer.innerText = '';
                textarea.disabled = true;
                document.getElementById('btnConfirm').style.display = 'none';
                document.getElementById('btnEdit').style.display = 'inline-block';
                document.getElementById('btnSave').style.display = 'inline-block';
            }
        }

        function handleEdit() {
            const textarea = document.getElementById('apiConfigInput');
            textarea.disabled = false;
            document.getElementById('btnConfirm').style.display = 'inline-block';
            document.getElementById('btnEdit').style.display = 'none';
            document.getElementById('btnSave').style.display = 'none';
        }

        function handleSave() {
            const textarea = document.getElementById('apiConfigInput');
            localStorage.setItem(STORAGE_KEY, textarea.value);
            goToHome();
        }

        // Home Page Logic & Fetching
        async function fetchETAs() {
            const tableBody = document.getElementById('etaTableBody');
            const rawConfig = localStorage.getItem(STORAGE_KEY) || '';
            const lines = rawConfig.split('\n').filter(line => line.trim().length > 0);

            if (lines.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5">No instructions found. Please click "Set up" to configure.</td></tr>';
                return;
            }

            const fragment = document.createDocumentFragment();

            for (const line of lines) {
                const validation = parseAndValidateLine(line);
                if (!validation.valid) continue;

                const { S, U } = validation.parsed;
                const row = document.createElement('tr');

                try {
                    const response = await fetch(U);
                    if (!response.ok) throw new Error('API request failed');
                    
                    const jsonData = await response.json();
                    const dataList = jsonData.data || [];

                    let route = '-';
                    let etaSeq1Diff = '-';
                    let etaSeq2Diff = '-';
                    let etaSeq3Diff = '-';

                    const now = new Date();

                    // Process ETA seq 1
                    const item1 = dataList.find(d => d.eta_seq === 1);
                    if (item1) {
                        route = item1.route || '-';
                        if (item1.eta) {
                            const etaDate = new Date(item1.eta);
                            etaSeq1Diff = Math.max(0, Math.round((etaDate - now) / 60000)) + ' mins';
                        }
                    }

                    // Process ETA seq 2
                    const item2 = dataList.find(d => d.eta_seq === 2);
                    if (item2) {
                        if (route === '-' && item2.route) route = item2.route;
                        if (item2.eta) {
                            const etaDate = new Date(item2.eta);
                            etaSeq2Diff = Math.max(0, Math.round((etaDate - now) / 60000)) + ' mins';
                        }
                    }

                    // Process ETA seq 3
                    const item3 = dataList.find(d => d.eta_seq === 3);
                    if (item3) {
                        if (route === '-' && item3.route) route = item3.route;
                        if (item3.eta) {
                            const etaDate = new Date(item3.eta);
                            etaSeq3Diff = Math.max(0, Math.round((etaDate - now) / 60000)) + ' mins';
                        }
                    }

                    row.innerHTML = `
                        <td><strong>${route}</strong></td>
                        <td>${S}</td>
                        <td>${etaSeq1Diff}</td>
                        <td>${etaSeq2Diff}</td>
                        <td>${etaSeq3Diff}</td>
                    `;
                } catch (error) {
                    row.innerHTML = `
                        <td>-</td>
                        <td>${S}</td>
                        <td colspan="3" style="color:red;">Failed to fetch data</td>
                    `;
                }

                fragment.appendChild(row);
            }

            tableBody.innerHTML = '';
            tableBody.appendChild(fragment);
        }
    </script>
</body>
</html>
