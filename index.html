<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴士到站時間 Release 1.1</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ccc;
            margin: 15px 0 20px 0;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 8px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .controls-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .timer-display {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            vertical-align: middle;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f2f2f2;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- HOME PAGE -->
    <h1>巴士到站時間 Release 1.1</h1>
    <hr>
    
    <div class="controls-row">
        <button class="btn" onclick="manualRefresh()">Refresh</button>
        <span id="countdownDisplay" class="timer-display">10</span>
    </div>

    <div id="etaDisplay">
        <table>
            <thead>
                <tr>
                    <th>路線</th>
                    <th>終站</th>
                    <th>首班車</th>
                    <th>次班車</th>
                    <th>三班車(分鐘)</th>
                </tr>
            </thead>
            <tbody id="etaTableBody">
                <tr><td colspan="5" class="loading">Loading ETA data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const REFRESH_INTERVAL = 10; // seconds
        let countdownInterval = null;
        let secondsRemaining = REFRESH_INTERVAL;

        // Hardcoded list of API instructions (O;S;D;U)
        const apiInstructions = [
            "海韻;荃灣;O;https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234A/1",
            "海韻;荃灣;I;https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234B/1",
            "海韻;荃灣;O;https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/53/1",
            "海韻;旺角;O;https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52X/1",
            "海韻;銅鑼灣;O;https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/002618/952",
            "深慈街;機場;O;https://data.etabus.gov.hk/v1/transport/kmb/eta/5A2A66038B409879/A38/1",
            "碧堤;屯門;I;https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/52X/1",
            "碧堤;元朗;I;https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/53/1",
            "碧堤;置樂;I;https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/002619/952"
        ];

        window.onload = function() {
            fetchETAs();
            startAutoRefresh();
        };

        // Auto Refresh Engine (10 Seconds)
        function startAutoRefresh() {
            stopAutoRefresh();
            secondsRemaining = REFRESH_INTERVAL;
            updateTimerDisplay();

            countdownInterval = setInterval(() => {
                secondsRemaining--;
                if (secondsRemaining <= 0) {
                    secondsRemaining = REFRESH_INTERVAL;
                    fetchETAs();
                }
                updateTimerDisplay();
            }, 1000);
        }

        function stopAutoRefresh() {
            if (countdownInterval) clearInterval(countdownInterval);
        }

        function updateTimerDisplay() {
            const timerElement = document.getElementById('countdownDisplay');
            if (timerElement) {
                timerElement.innerText = secondsRemaining;
            }
        }

        function manualRefresh() {
            fetchETAs();
            startAutoRefresh();
        }

        // Helper function to parse O;S;D;U lines
        function parseInstructionLine(line) {
            const parts = line.split(';').map(p => p.trim());
            if (parts.length !== 4) return null;
            return { O: parts[0], S: parts[1], D: parts[2], U: parts[3] };
        }

        // API Fetching and Display Processing
        async function fetchETAs() {
            const tableBody = document.getElementById('etaTableBody');
            const fragment = document.createDocumentFragment();

            for (const line of apiInstructions) {
                const parsed = parseInstructionLine(line);
                if (!parsed) continue;

                const { S, U } = parsed;
                const row = document.createElement('tr');

                try {
                    const response = await fetch(U);
                    if (!response.ok) throw new Error('API request failed');
                    
                    const jsonData = await response.json();
                    const dataList = jsonData.data || [];

                    let route = '-';
                    let eta1_diff = '-';
                    let eta2_diff = '-';
                    let eta3_diff = '-';

                    const now = new Date();

                    // Retrieve route from the API response payload
                    if (dataList.length > 0 && dataList[0].route) {
                        route = dataList[0].route;
                    }

                    // Process eta_seq = 1
                    const item1 = dataList.find(d => d.eta_seq === 1);
                    if (item1 && item1.eta) {
                        const etaDate = new Date(item1.eta);
                        eta1_diff = Math.max(0, Math.round((etaDate - now) / 60000));
                    }

                    // Process eta_seq = 2
                    const item2 = dataList.find(d => d.eta_seq === 3 || d.eta_seq === 2);
                    if (item2 && item2.eta) {
                        const etaDate = new Date(item2.eta);
                        eta2_diff = Math.max(0, Math.round((etaDate - now) / 60000));
                    }

                    // Process eta_seq = 3
                    const item3 = dataList.find(d => d.eta_seq === 3);
                    if (item3 && item3.eta) {
                        const etaDate = new Date(item3.eta);
                        eta3_diff = Math.max(0, Math.round((etaDate - now) / 60000));
                    }

                    row.innerHTML = `
                        <td><strong>${route}</strong></td>
                        <td>${S}</td>
                        <td>${eta1_diff}</td>
                        <td>${eta2_diff}</td>
                        <td>${eta3_diff}</td>
                    `;
                } catch (error) {
                    row.innerHTML = `
                        <td>-</td>
                        <td>${S}</td>
                        <td colspan="3" style="color:red;">Failed to fetch data</td>
                    `;
                }

                fragment.appendChild(row);
            }

            tableBody.innerHTML = '';
            tableBody.appendChild(fragment);
        }
    </script>
</body>
</html>
